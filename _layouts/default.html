<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  {% if site.indiekit_url %}
  <link rel="authorization_endpoint" href="{{ site.indiekit_url }}/auth">
  <link rel="token_endpoint" href="{{ site.indiekit_url }}/auth/token">
  <link rel="micropub" href="{{ site.indiekit_url }}/micropub">
  {% endif %}
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/feed.xml" />
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="/">Home</a>
      <a href="/content/">Content</a>
      <a href="{{ site.github_url }}">GitHub</a>
      <a href="/feed.xml">RSS</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <script src="/assets/script.js"></script>
</body>
</html>
